name: Continuous Integration & Automated Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test & Build (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Backend Dependencies
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: ./site
        run: npm ci

      - name: Build Frontend Application (Vite)
        working-directory: ./site
        run: npm run build

      - name: Initialize Testing Environment (.env)
        shell: bash
        run: |
          cp .env.example .env
          echo "JWT_SECRET=super-secret-ci-testing-key-with-64-characters-0123456789abcdef01234567" >> .env

      - name: Initialize Database Schema (Drizzle Push)
        run: npx drizzle-kit push

      - name: Seed Reference Data
        run: node src/scripts/seedTurmas.js

      - name: Run Complete Automated Test Suite
        env:
          JWT_SECRET: super-secret-ci-testing-key-with-64-characters-0123456789abcdef01234567
          COOKIE_SECURE: false
          NODE_ENV: test
        run: npm test
